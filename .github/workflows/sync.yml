name: Kijklijst verversen

on:
  schedule:
    - cron: "17 4 * * *"        # elke dag, 05:17 (winter) of 06:17 (zomer) Nederlandse tijd
  workflow_dispatch:            # handmatig starten via Actions → Kijklijst verversen → Run workflow
  push:
    branches: [main]
    paths: ["site/index.html", "scripts/**", "config.json", ".github/workflows/sync.yml"]

permissions:
  contents: write               # om de opgehaalde gegevens in de repository te bewaren
  pages: write                  # om de site te publiceren
  id-token: write

concurrency:
  group: kijklijst
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Lijsten en aanbod ophalen
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/sync.mjs

      - name: Resultaat bewaren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data cache
          git diff --cached --quiet && exit 0
          git commit -q -m "Aanbod ververst"
          git push -q || (git pull -q --rebase && git push -q)

      # De site wordt ook gepubliceerd als het ophalen mislukte: dan blijft de vorige stand zichtbaar.
      - uses: actions/configure-pages@v6
        if: ${{ !cancelled() }}
      - uses: actions/upload-pages-artifact@v5
        if: ${{ !cancelled() }}
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
        if: ${{ !cancelled() }}
